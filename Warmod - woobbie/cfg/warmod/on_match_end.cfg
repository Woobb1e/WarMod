// woobbie x GameTech - warmod - End Config
// This script is executed at the end or reset of a match
//
// HOW IT WORKS:
//   - Lines WITHOUT "// endinfo " are executed as normal server commands (e.g. sv_alltalk 1)
//   - Lines starting with "// endinfo " are displayed in everyone's chat at match end
//   - {demo} is automatically replaced with the actual demo file recorded for this match
//     (e.g. demos/2026-09-05-2147-de_dust2-teamA-vs-teamb.dem) - or "no demo recorded"
//   - {#RRGGBB} tags are colors (e.g. {#FFD700} = gold, {#FFFFFF} = white)
//   - Max ~256 characters per line

sv_alltalk 1

