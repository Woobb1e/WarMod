"warmod_damage_colors"
{
    "prefix"  "{#88E788}[{#FFAC1C}WarMod{#88E788}]"
    "col_lg"  "{#00F700}"
    "col_w"   "{#00F700}"
    "col_t"   "{#FF4040}"
    "col_ct"  "{#99CCFF}"
}

// prefix  → the full prefix shown before each damage line (e.g. [FACEIT^] To: ...).
//           The entire string is literal — change delimiters, text and colors freely.
//           Use {#RRGGBB} tags inside for multi-color prefixes like [{#FFD700}FACEIT^{#FFFFFF}].
//           Set to "" (empty) to disable the prefix entirely.
//           Examples:  "[FACEIT^]"   "<WarMod>"   "[{#FFD700}FACEIT^{#FFFFFF}]"   ""
// col_lg   → numeric parts (damage / hits / HP).
// col_w    → surrounding text, brackets, separators and the To:/From: labels.
// col_t    → enemy name color when the enemy is on Terrorist team.
// col_ct   → enemy name color when the enemy is on Counter-Terrorist team.
